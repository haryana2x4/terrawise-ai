<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Ender Dragon Visual Test</title>
  <link rel="stylesheet" href="majestic.css">
  <script src="stormforge/config.js"></script>
  <script src="stormforge/time_of_day.js"></script>
  <script src="stormforge/audio_bed.js"></script>
  <script src="stormforge/weather.js"></script>
  <script src="stormforge/vael.js"></script>
</head>
<body style="background: #030509; overflow: hidden; height: 100vh; width: 100vw;">
  <canvas id="stormforge-weather-canvas"></canvas>

  <div style="position:relative; z-index:10; padding:40px; text-align:center;">
    <h1 style="color:#ffffff; font-size:32px; margin-bottom:10px; text-shadow: 0 0 16px rgba(168, 85, 247, 0.6);">MINECRAFT ENDER DRAGON TOY FIGURE</h1>
    <p style="color:#c084fc; font-size:15px;">Blocky Obsidian Voxel Body • Articulated Gray Bat Wings • Gray Spine Plates • Glowing Purple Eyes</p>
  </div>

  <script>
    const weather = new WeatherSystem(document.getElementById('stormforge-weather-canvas'));
    const vael = new StormwyrmVael();
    vael.setSkin('enderDragon');
    vael.active = true;
    vael.canvas.style.display = 'block';
    vael.variant = 'wideArc';
    vael.startTime = performance.now() - (vael.duration * 0.28);

    let last = performance.now();
    function tick() {
      requestAnimationFrame(tick);
      const now = performance.now();
      const delta = (now - last) / 1000;
      last = now;

      weather.update(delta);
      weather.render();

      vael.update(delta);
      // Loop mid-flight position for display
      if (vael.progress > 0.45 || !vael.active) {
        vael.active = true;
        vael.canvas.style.display = 'block';
        vael.startTime = performance.now() - (vael.duration * 0.28);
      }
      vael.render();
    }
    tick();
  </script>
</body>
</html>
